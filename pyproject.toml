[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rooomtech-llm-router"
version = "0.1.0"
description = "Sovereign, explainable, adaptive multi-LLM orchestration behind an OpenAI-compatible API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "ROOOMTECH" }]
keywords = ["llm", "router", "multi-agent", "openai-compatible", "air-gap"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.scripts]
rooomtech-router = "rooomtech_router.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

