[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rooom-route"
version = "0.3.0"
description = "Sovereign, explainable, adaptive multi-LLM routing behind an OpenAI-compatible API"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{ name = "ROOOMTECH" }]
keywords = ["llm", "router", "multi-agent", "openai-compatible", "air-gap"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.scripts]
rooom-route = "rooomtech_router.server:main"
rooomtech-router = "rooomtech_router.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
